name: Verify Homebrew formula

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to verify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-formula:
    name: Verify formula for release tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Homebrew formula inputs
        run: bash tools/bump-brew-formula.sh --dry-run "${TAG_NAME}"
